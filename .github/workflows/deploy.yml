name: Deploy ASP.NET Core to Client

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        required: true
        type: choice
        options: [Noble, Mamitonnesa, DMCPS]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Set FTP variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ "$client" = "Noble" ]; then
            echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
          elif [ "$client" = "Mamitonnesa" ]; then
            echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
          else
            echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
          fi

      ##########################################################
      # 1. Upload app_offline.htm (FAST)
      ##########################################################
      - name: Upload app_offline.htm
        run: |
          echo "<h2>Maintenance...</h2>" > app_offline.htm
        shell: bash

      - name: Upload offline file
        uses: sebastianpopp/ftp-action@v2
        with:
          host: ${{ steps.vars.outputs.server }}
          user: ${{ steps.vars.outputs.username }}
          password: ${{ steps.vars.outputs.password }}
          localPath: app_offline.htm
          remotePath: ${{ steps.vars.outputs.path }}/app_offline.htm

      ##########################################################
      # 2. Upload only changed publish files (VERY FAST)
      ##########################################################
      - name: Upload published files
        uses: sebastianpopp/ftp-action@v2
        with:
          host: ${{ steps.vars.outputs.server }}
          user: ${{ steps.vars.outputs.username }}
          password: ${{ steps.vars.outputs.password }}
          localPath: publish
          remotePath: ${{ steps.vars.outputs.path }}
          # Upload only differences = FAST
          options: "--only-newer --recursive"

      ##########################################################
      # 3. Remove app_offline.htm (FAST)
      ##########################################################
      - name: Remove app_offline.htm
        uses: sebastianpopp/ftp-action@v2
        with:
          host: ${{ steps.vars.outputs.server }}
          user: ${{ steps.vars.outputs.username }}
          password: ${{ steps.vars.outputs.password }}
          command: "delete ${{ steps.vars.outputs.path }}/app_offline.htm"

      ##########################################################
      # 4. Verify site
      ##########################################################
      - name: Verify website
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.vars.outputs.url }})
          if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
            echo "Live: $code"
          else
            echo "Error: $code"
            exit 1
          fi
