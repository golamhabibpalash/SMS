name: Deploy ASP.NET Core to Client

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: 'Select client to deploy'
        required: true
        type: choice
        options: 
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then
            client="Noble"
          fi
          
          case "$client" in
            "Noble")
              echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
              echo "client_name=Noble" >> $GITHUB_OUTPUT
              ;;
            "Mamitonnesa")
              echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
              echo "client_name=Mamitonnesa" >> $GITHUB_OUTPUT
              ;;
            "DMCPS")
              echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
              echo "client_name=DMCPS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install lftp
        shell: bash
        run: |
          if ! command -v lftp &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install lftp -y
          fi

      - name: Create maintenance page
        shell: bash
        run: |
          cat > ./publish/app_offline.htm << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Maintenance</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
              h1 { color: #333; }
              p { color: #666; }
            </style>
          </head>
          <body>
            <h1>System Maintenance</h1>
            <p>We're updating the system. This will only take a moment...</p>
            <p><small>Please refresh in a few seconds</small></p>
          </body>
          </html>
          EOF

      - name: Upload maintenance page (lftp)
        shell: bash
        run: |
          echo "Uploading maintenance page..."

          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
          set ftp:passive-mode on
          set net:max-retries 2
          set net:timeout 30

          put ./publish/app_offline.htm -o "${{ steps.vars.outputs.path }}/app_offline.htm"
          quit
          EOF

          echo "Maintenance page uploaded."

      - name: Wait for app to go offline
        shell: bash
        run: sleep 3

      - name: Deploy application files with lftp
        shell: bash
        run: |
          echo "Starting application deployment using lftp..."

          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
          set ftp:passive-mode on
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-allow no

          mirror -R \
            --parallel=10 \
            --only-newer \
            --exclude app_offline.htm \
            ./publish \
            "${{ steps.vars.outputs.path }}"

          quit
          EOF

          echo "Deployment completed with lftp."

      - name: Remove maintenance page
        shell: bash
        continue-on-error: true
        run: |
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
          set ftp:passive-mode on
          rm "${{ steps.vars.outputs.path }}/app_offline.htm"
          quit
          EOF
          echo "Maintenance page removed."

      - name: Wait for app to restart
        shell: bash
        run: sleep 5

      - name: Verify deployment
        shell: bash
        run: |
          url="${{ steps.vars.outputs.url }}"
          retries=5
          count=0
          success=false
          
          while [ $count -lt $retries ] && [ "$success" = false ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            
            if [[ "$code" == "200" || "$code" == "301" || "$code" == "302" ]]; then
              echo "Deployment verified with status code $code"
              success=true
            else
              count=$((count+1))
              echo "Retrying ($count/$retries)... current status: $code"
              sleep 5
            fi
          done
          
          if [ "$success" = false ]; then
            echo "Deployment verification failed."
            exit 1
          fi

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "✓ Deployment Successful!"
          echo "========================================"
          echo "Client: ${{ steps.vars.outputs.client_name }}"
          echo "URL: ${{ steps.vars.outputs.url }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"
