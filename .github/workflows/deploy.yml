name: Deploy ASP.NET Core (Skip wwwroot)

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: 'Select client to deploy'
        required: true
        type: choice
        options:
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then
            client="DMCPS"
          fi

          case "$client" in
            "Noble")
              echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
              echo "client_name=Noble" >> $GITHUB_OUTPUT
              ;;
            "Mamitonnesa")
              echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
              echo "client_name=Mamitonnesa" >> $GITHUB_OUTPUT
              ;;
            "DMCPS")
              echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
              echo "client_name=DMCPS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Create maintenance page
        shell: bash
        run: |
          cat > ./maintenance.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Maintenance</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
              h1 { color: #333; }
              p { color: #666; }
            </style>
          </head>
          <body>
            <h1>System Maintenance</h1>
            <p>We're updating the system. This will only take a moment...</p>
            <p><small>Please refresh in a few seconds</small></p>
          </body>
          </html>
          EOF

      - name: Upload maintenance page
        shell: bash
        run: |
          echo "Uploading maintenance page..."
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 30
            cd "${{ steps.vars.outputs.path }}"
            put ./maintenance.html -o app_offline.htm
            quit
          EOF
          echo "Maintenance page uploaded"

      - name: Wait for app to go offline
        run: |
          echo "Waiting for application to go offline..."
          sleep 8

      - name: Upload application files (SKIP wwwroot completely)
        shell: bash
        run: |
          echo "Starting file upload (skipping wwwroot folder)..."
          echo "Server: ${{ steps.vars.outputs.server }}"
          echo "Path: ${{ steps.vars.outputs.path }}"
          
          # Count total files to upload (excluding wwwroot and appsettings)
          total_files=$(find ./publish -type f ! -path "*/wwwroot/*" ! -name "appsettings.json" ! -name "appsettings.*.json" | wc -l)
          echo "Found $total_files files to upload (excluding wwwroot)"
          
          uploaded=0
          failed=0
          
          # Create a file list to process
          file_list=$(find ./publish -type f ! -path "*/wwwroot/*" ! -name "appsettings.json" ! -name "appsettings.*.json")
          
          # Process each file
          echo "$file_list" | while read file; do
            # Get relative path from publish folder
            rel_path="${file#./publish/}"
            dir_path=$(dirname "$rel_path")
            
            uploaded=$((uploaded + 1))
            
            # Show progress every 10 files
            if [ $((uploaded % 10)) -eq 0 ]; then
              echo "Progress: $uploaded/$total_files files uploaded"
            fi
            
            # Try to upload the file
            if lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<UPLOAD_EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 30
            cd "${{ steps.vars.outputs.path }}"
            mkdir -p "$dir_path"
            put "$file" -o "$rel_path"
            quit
            UPLOAD_EOF
            then
              echo "  ✓ $rel_path"
            else
              echo "  ✗ Failed: $rel_path"
              failed=$((failed + 1))
            fi
          done
          
          echo "========================================"
          echo "Upload completed:"
          echo "  Successfully uploaded: $uploaded files"
          if [ $failed -gt 0 ]; then
            echo "  Failed uploads: $failed files"
          fi
          echo "  wwwroot folder was NOT touched"
          echo "========================================"
          
          if [ $failed -gt 0 ]; then
            echo "Warning: Some files failed to upload"
          fi

      - name: Remove maintenance page
        shell: bash
        continue-on-error: true
        run: |
          echo "Removing maintenance page..."
          max_retries=3
          
          for i in $(seq 1 $max_retries); do
            echo "Attempt $i/$max_retries..."
            
            if lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 15
            cd "${{ steps.vars.outputs.path }}"
            rm -f app_offline.htm
            quit
            EOF
            then
              echo "✓ Maintenance page removed successfully"
              break
            else
              echo "✗ Attempt $i failed"
              if [ $i -lt $max_retries ]; then
                sleep 5
              fi
            fi
          done

      - name: Verify deployment
        shell: bash
        run: |
          url="${{ steps.vars.outputs.url }}"
          max_attempts=15
          attempt=1
          
          echo "Verifying deployment: $url"
          echo "Waiting for application to come online..."
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
            
            # Try to get HTTP status
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 0 "$url" 2>/dev/null || echo "000")
            
            echo "HTTP Status: $status_code"
            
            if [[ "$status_code" == "200" || "$status_code" == "301" || "$status_code" == "302" ]]; then
              echo "✅ SUCCESS: Application is online!"
              exit 0
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 10 seconds before next attempt..."
              sleep 10
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "❌ ERROR: Application did not come online after $max_attempts attempts"
          echo "Last status code: $status_code"
          
          # Try one more time with verbose output
          echo "Final diagnostic attempt..."
          curl -v --max-time 30 "$url" 2>&1 | head -20
          
          exit 1

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          echo "Cleaning up..."
          rm -f ./maintenance.html
          echo "Cleanup completed"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║        DEPLOYMENT SUCCESSFUL          ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ Client:   ${{ steps.vars.outputs.client_name }}"
          echo "║ URL:      ${{ steps.vars.outputs.url }}"
          echo "║ Time:     $(date '+%Y-%m-%d %H:%M:%S')"
          echo "║ Status:   ✅ Online and running"
          echo "║"
          echo "║ Note: wwwroot folder was preserved"
          echo "║       (not modified during deployment)"
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: Deployment failed
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║         DEPLOYMENT FAILED             ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ Client:   ${{ steps.vars.outputs.client_name }}"
          echo "║ URL:      ${{ steps.vars.outputs.url }}"
          echo "║ Time:     $(date '+%Y-%m-%d %H:%M:%S')"
          echo "║ Status:   ❌ Failed"
          echo "║"
          echo "║ Check the logs above for error details"
          echo "║ wwwroot folder was NOT modified"
          echo "╚════════════════════════════════════════╝"
          echo ""