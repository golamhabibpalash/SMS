name: Deploy ASP.NET Core to Client

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: 'Select client to deploy'
        required: true
        type: choice
        options: 
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then
            client="Noble"  # Default for push events
          fi
          
          case "$client" in
            "Noble")
              echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
              echo "client_name=Noble" >> $GITHUB_OUTPUT
              ;;
            "Mamitonnesa")
              echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
              echo "client_name=Mamitonnesa" >> $GITHUB_OUTPUT
              ;;
            "DMCPS")
              echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
              echo "client_name=DMCPS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install lftp (if not available)
        shell: bash
        run: |
          echo "Skipping lftp installation - using curl instead"

      - name: Create maintenance page
        shell: bash
        run: |
          cat > ./publish/app_offline.htm << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Maintenance</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
              h1 { color: #333; }
              p { color: #666; }
            </style>
          </head>
          <body>
            <h1>System Maintenance</h1>
            <p>We're updating the system. This will only take a moment...</p>
            <p><small>Please refresh in a few seconds</small></p>
          </body>
          </html>
          EOF

      - name: Upload maintenance page
        shell: bash
        run: |
          # Upload using curl - more compatible with various FTP servers
          curl --ftp-create-dirs --ftp-pasv \
               --retry 3 \
               --retry-delay 5 \
               --connect-timeout 30 \
               --max-time 120 \
               -T ./publish/app_offline.htm \
               --user "${{ steps.vars.outputs.username }}:${{ steps.vars.outputs.password }}" \
               "ftp://${{ steps.vars.outputs.server }}${{ steps.vars.outputs.path }}/app_offline.htm"
          echo "Maintenance page uploaded successfully"

      - name: Wait for app to go offline
        shell: bash
        run: sleep 3

      - name: Create deployment state cache
        shell: bash
        run: |
          # Create a hash of all files to track changes
          mkdir -p .deployment-cache
          cd ./publish
          find . -type f -not -path '*/.*' -exec md5sum {} \; | sort > ../.deployment-cache/current-state.txt
          
          # Show what will be deployed
          if [ -f ../.deployment-cache/last-state.txt ]; then
            echo "Comparing with previous deployment..."
            diff ../.deployment-cache/last-state.txt ../.deployment-cache/current-state.txt > ../.deployment-cache/changes.txt || true
            
            if [ -s ../.deployment-cache/changes.txt ]; then
              echo "Changed files detected:"
              cat ../.deployment-cache/changes.txt | grep "^>" | awk '{print $3}' || echo "No changes"
            else
              echo "No changes detected"
            fi
          else
            echo "First deployment - all files will be uploaded"
          fi

      - name: Deploy application files with curl
        shell: bash
        run: |
          echo "Starting deployment..."
          
          uploaded=0
          skipped=0
          
          # Function to get file hash
          get_hash() {
            md5sum "$1" | awk '{print $1}'
          }
          
          # Function to check if file changed
          file_changed() {
            local file="$1"
            if [ ! -f .deployment-cache/last-state.txt ]; then
              return 0  # First deployment, upload all
            fi
            
            local current_hash=$(get_hash "$file")
            local rel_path="${file#./publish/}"
            
            # Check if file exists in previous state with same hash
            if grep -q "$current_hash  ./$rel_path" .deployment-cache/last-state.txt 2>/dev/null; then
              return 1  # File unchanged
            fi
            return 0  # File changed or new
          }
          
          # Upload files
          cd ./publish
          find . -type f -not -path '*/.*' -not -name 'app_offline.htm' | while read -r file; do
            rel_path="${file#./}"
            
            if file_changed "$file"; then
              echo "Uploading: $rel_path"
              
              curl --ftp-create-dirs --ftp-pasv \
                   --retry 2 \
                   --retry-delay 3 \
                   --connect-timeout 30 \
                   --max-time 180 \
                   -T "$file" \
                   --user "${{ steps.vars.outputs.username }}:${{ steps.vars.outputs.password }}" \
                   "ftp://${{ steps.vars.outputs.server }}${{ steps.vars.outputs.path }}/$rel_path" 2>&1 | grep -v "Warning: Binary output"
              
              if [ $? -eq 0 ]; then
                uploaded=$((uploaded + 1))
              else
                echo "Failed to upload: $rel_path"
                exit 1
              fi
            else
              skipped=$((skipped + 1))
            fi
          done
          
          echo "✓ Deployment completed: $uploaded uploaded, $skipped unchanged"
          
      - name: Update deployment state
        if: success()
        shell: bash
        run: |
          # Save current state for next deployment
          cp .deployment-cache/current-state.txt .deployment-cache/last-state.txt
          echo "Deployment state saved"

      - name: Remove maintenance page
        shell: bash
        continue-on-error: true
        run: |
          # Delete using curl
          curl --ftp-pasv \
               --user "${{ steps.vars.outputs.username }}:${{ steps.vars.outputs.password }}" \
               -Q "DELE ${{ steps.vars.outputs.path }}/app_offline.htm" \
               "ftp://${{ steps.vars.outputs.server }}" \
               && echo "Maintenance page removed successfully" \
               || echo "Maintenance page removal attempted"

      - name: Wait for app to restart
        shell: bash
        run: sleep 5

      - name: Verify deployment
        shell: bash
        run: |
          url="${{ steps.vars.outputs.url }}"
          max_retries=5
          retry_count=0
          success=false
          
          while [ $retry_count -lt $max_retries ] && [ "$success" = "false" ]; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || echo "000")
            
            if [ "$status_code" = "200" ] || [ "$status_code" = "301" ] || [ "$status_code" = "302" ]; then
              echo "✓ Deployment verified! Site is live with status code: $status_code"
              success=true
            else
              retry_count=$((retry_count + 1))
              if [ $retry_count -lt $max_retries ]; then
                echo "Retry $retry_count/$max_retries - Waiting for site to respond... (Status: $status_code)"
                sleep 5
              else
                echo "Error: Site verification failed after $max_retries attempts (Status: $status_code)"
                exit 1
              fi
            fi
          done

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "✓ Deployment Successful!"
          echo "========================================"
          echo "Client: ${{ steps.vars.outputs.client_name }}"
          echo "URL: ${{ steps.vars.outputs.url }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"