name: Deploy EIMS

# One release branch, one build, fanned out to every instance.
#
#   push to FinalDeployment ............ deploys ALL instances
#   Run workflow -> pick an instance ... deploys just that one (or "all")
#
# Each instance is a GitHub *Environment* (Settings -> Environments) whose name
# matches an entry below. Give every environment these secrets/vars:
#
#   secrets: FTP_SERVER  FTP_USERNAME  FTP_PASSWORD  FTP_PATH
#            SSH_HOST  SSH_USER  SSH_KEY        (Linux/systemd hosts only - omit on IIS)
#   vars:    SITE_URL                          (used for the post-deploy health check)
#            SERVICE_NAME                      (optional; defaults to eims-<client>.service)
#
# Per-instance config (appsettings*.json), data-protection Keys/ and uploaded
# images stay on each server - the deploy never touches them.

on:
  push:
    branches: [FinalDeployment]
  workflow_dispatch:
    inputs:
      client:
        description: "Instance to deploy"
        required: true
        default: all
        type: choice
        options:
          - all
          - Noble
          - Mamitonnesa
          - DMCPS
          - Unityschoolbd
          - Curiosity

jobs:
  # 1. Decide which instances this run targets ------------------------------
  setup:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          all='["Noble","Mamitonnesa","DMCPS","Unityschoolbd","Curiosity"]'
          sel="${{ github.event.inputs.client }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$sel" ] && [ "$sel" != "all" ]; then
            echo "matrix={\"client\":[\"$sel\"]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"client\":$all}" >> "$GITHUB_OUTPUT"
          fi

  # 2. Build & publish ONCE - every instance gets byte-identical output -----
  build:
    needs: setup
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Stamps the version so every deployment is identifiable in the UI footer.
      # The product version itself lives in Directory.Build.props.
      - name: Build metadata
        id: meta
        shell: bash
        run: |
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_utc=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish SMS_App/SMS_App.csproj -c Release -o ./publish --nologo
          -p:BuildNumber=${{ steps.meta.outputs.build_number }}
          -p:GitCommit=${{ steps.meta.outputs.git_commit }}
          -p:BuildTimestampUtc="${{ steps.meta.outputs.built_utc }}"

      - name: Strip files that must never leave the build server
        shell: bash
        run: |
          rm -f  ./publish/appsettings*.json   # per-instance config lives on each server
          rm -f  ./publish/*.pdb               # debug symbols
          rm -rf ./publish/publish             # guard against a stray nested publish dir

      - name: Package
        shell: bash
        run: tar -czf eims-publish.tgz -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: eims-publish
          path: eims-publish.tgz
          retention-days: 2
          if-no-files-found: error

  # 3. Deploy the same package to each targeted instance -------------------
  deploy:
    needs: [setup, build]
    runs-on: self-hosted
    timeout-minutes: 30
    environment: ${{ matrix.client }}
    concurrency:
      group: deploy-${{ matrix.client }}
      cancel-in-progress: false
    strategy:
      fail-fast: false          # one instance failing must not block the others
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eims-publish

      - name: Unpack
        shell: bash
        run: |
          rm -rf publish && mkdir publish
          tar -xzf eims-publish.tgz -C publish

      - name: Take the app offline
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          cat > app_offline.htm <<'EOF'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>System Maintenance</title><style>
          body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;
          padding:50px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;
          margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
          .card{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:40px;
          border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,.1);max-width:500px}
          h1{margin:0 0 20px;font-size:2em}p{font-size:1.1em;margin:10px 0}
          .spin{border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;
          width:40px;height:40px;animation:s 1s linear infinite;margin:20px auto}
          @keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="card">
          <h1>&#128295; System Maintenance</h1><div class="spin"></div>
          <p>We're updating the system with the latest improvements.</p>
          <p><small>This will only take a moment. Please refresh in a few seconds.</small></p>
          </div></body></html>
          EOF
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          cd "$FTP_PATH"
          put app_offline.htm -o app_offline.htm
          bye
          EOF
          sleep 5

      - name: Deploy via FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          # mirror -R uploads; no --delete, so server-side files we exclude are
          # left untouched. lftp only transfers files whose size/timestamp changed,
          # so after the first run this pushes just what actually changed.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 120
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set ftp:use-site-chmod no
          set ftp:use-site-utime no
          set file:charset utf-8
          cd "$FTP_PATH"
          mirror -R --verbose --no-perms --no-umask \
            --exclude-glob app_offline.htm \
            --exclude-glob appsettings*.json \
            --exclude-glob *.pdb \
            --exclude Keys/ \
            --exclude logs/ \
            --exclude wwwroot/Images/Student/Photo/ \
            --exclude wwwroot/Images/Employee/photo/ \
            --exclude wwwroot/Images/Institute/ \
            --parallel=3 \
            ./publish/ .
          bye
          EOF

      - name: Restart service (Linux/systemd hosts only)
        shell: bash
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          CLIENT: ${{ matrix.client }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "No SSH secrets for $CLIENT - IIS host, removing app_offline.htm recycles the app pool."
            exit 0
          fi
          svc="${SERVICE_NAME:-eims-$(echo "$CLIENT" | tr '[:upper:]' '[:lower:]').service}"
          echo "Restarting $svc on $SSH_HOST..."
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "sudo systemctl restart $svc"
          rm -f ~/.ssh/deploy_key

      - name: Bring the app back online
        if: always()
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          cd "$FTP_PATH"
          rm -f app_offline.htm
          bye
          EOF
          sleep 10

      - name: Verify
        shell: bash
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLIENT: ${{ matrix.client }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "No SITE_URL var for $CLIENT - skipping health check."
            exit 0
          fi
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$SITE_URL" --max-time 10 || echo 000)
            echo "Attempt $i: HTTP $code"
            case "$code" in
              200|301|302) echo "OK - $SITE_URL is up"; exit 0 ;;
            esac
            sleep 5
          done
          echo "WARNING: could not confirm $SITE_URL - check it manually."

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.client }} - ${{ job.status }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| URL | ${{ vars.SITE_URL }} |"
            echo "| Build | ${{ github.run_number }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Branch | ${{ github.ref_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf publish eims-publish.tgz app_offline.htm
