name: Deploy ASP.NET Core to Client

on:
  # Automatically trigger on push to deployment branch
  push:
    branches:
      - FinalDeployment   # Change to your deployment branch
  # Manual trigger with client selection
  workflow_dispatch:
    inputs:
      client:
        description: "Select client to deploy"
        required: true
        type: choice
        options:
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 3️⃣ Restore dependencies
      - name: Restore
        run: dotnet restore

      # 4️⃣ Build project
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 5️⃣ Publish project
      - name: Publish
        run: dotnet publish -c Release -o ./publish

      # 6️⃣ Set deployment variables based on client
      - name: Set deployment variables
        id: vars
        shell: pwsh
        run: |
          # Use manual input if available, otherwise default to DMCPS
          $client = "${{ github.event.inputs.client }}"
          if ([string]::IsNullOrEmpty($client)) { $client = "DMCPS" }
          Write-Host "Selected client: $client"

          if ($client -eq "Noble") {
            echo "ftp_server=${{ secrets.NOBLE_FTP_SERVER }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_username=${{ secrets.NOBLE_FTP_USERNAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_password=${{ secrets.NOBLE_FTP_PASSWORD }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_path=${{ secrets.NOBLE_FTP_PATH }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $url = "https://eims.nobleschoolbd.com"
          }
          elseif ($client -eq "Mamitonnesa") {
            echo "ftp_server=${{ secrets.MAMI_FTP_SERVER }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_username=${{ secrets.MAMI_FTP_USERNAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_password=${{ secrets.MAMI_FTP_PASSWORD }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_path=${{ secrets.MAMI_FTP_PATH }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $url = "https://eims.mamitonnessaghs.edu.bd"
          }
          elseif ($client -eq "DMCPS") {
            echo "ftp_server=${{ secrets.DMCPS_FTP_SERVER }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_username=${{ secrets.DMCPS_FTP_USERNAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_password=${{ secrets.DMCPS_FTP_PASSWORD }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "ftp_path=${{ secrets.DMCPS_FTP_PATH }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $url = "https://eims.mcpsbd.com"
          }
          else {
            Write-Error "Unknown client selected: $client"
          }
          echo "deploy_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 7️⃣ Deploy via FTP
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.ftp_server }}
          username: ${{ steps.vars.outputs.ftp_username }}
          password: ${{ steps.vars.outputs.ftp_password }}
          server-dir: ${{ steps.vars.outputs.ftp_path }}
          local-dir: ./publish/
          protocol: ftps
          security: explicit
          timeout: 600000
          passive: true
          max-retries: 5
          retry-wait: 15000
          dangerous-clean-slate: true

      # 8️⃣ Post-deployment HTTP check
      - name: Verify website is live
        shell: pwsh
        run: |
          $url = "${{ steps.vars.outputs.deploy_url }}"
          Write-Host "Checking if website is live at $url ..."
          try {
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
            if ($response.StatusCode -eq 200) {
              Write-Host "✅ Website $url is live. Deployment successful."
            } else {
              Write-Error "❌ Website $url returned status $($response.StatusCode)"
            }
          } catch {
            Write-Error "❌ Website $url is not reachable. Deployment failed."
          }
