name: Deploy ASP.NET Core to Client

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: 'Select client to deploy'
        required: true
        type: choice
        options: 
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: pwsh
        run: |
          $client = "${{ github.event.inputs.client }}"
          if ([string]::IsNullOrEmpty($client)) {
            $client = "DMCPS"  # Default for push events
          }
          
          switch ($client) {
            "Noble" {
              "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $env:GITHUB_OUTPUT
              "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $env:GITHUB_OUTPUT
              "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $env:GITHUB_OUTPUT
              "path=${{ secrets.NOBLE_FTP_PATH }}" >> $env:GITHUB_OUTPUT
              "url=https://eims.nobleschoolbd.com" >> $env:GITHUB_OUTPUT
              "client_name=Noble" >> $env:GITHUB_OUTPUT
            }
            "Mamitonnesa" {
              "server=${{ secrets.MAMI_FTP_SERVER }}" >> $env:GITHUB_OUTPUT
              "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $env:GITHUB_OUTPUT
              "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $env:GITHUB_OUTPUT
              "path=${{ secrets.MAMI_FTP_PATH }}" >> $env:GITHUB_OUTPUT
              "url=https://eims.mamitonnessaghs.edu.bd" >> $env:GITHUB_OUTPUT
              "client_name=Mamitonnesa" >> $env:GITHUB_OUTPUT
            }
            "DMCPS" {
              "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $env:GITHUB_OUTPUT
              "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $env:GITHUB_OUTPUT
              "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $env:GITHUB_OUTPUT
              "path=${{ secrets.DMCPS_FTP_PATH }}" >> $env:GITHUB_OUTPUT
              "url=https://eims.mcpsbd.com" >> $env:GITHUB_OUTPUT
              "client_name=DMCPS" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Create maintenance page
        shell: pwsh
        run: |
          @"
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Maintenance</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
              h1 { color: #333; }
              p { color: #666; }
            </style>
          </head>
          <body>
            <h1>System Maintenance</h1>
            <p>We're updating the system. This will only take a moment...</p>
            <p><small>Please refresh in a few seconds</small></p>
          </body>
          </html>
          "@ | Out-File -FilePath ./publish/app_offline.htm -Encoding UTF8

      - name: Upload maintenance page
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.server }}
          username: ${{ steps.vars.outputs.username }}
          password: ${{ steps.vars.outputs.password }}
          local-dir: ./publish/
          server-dir: ${{ steps.vars.outputs.path }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            **/.vs/**
          include: |
            app_offline.htm

      - name: Wait for app to go offline
        shell: pwsh
        run: Start-Sleep -Seconds 3

      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.server }}
          username: ${{ steps.vars.outputs.username }}
          password: ${{ steps.vars.outputs.password }}
          local-dir: ./publish/
          server-dir: ${{ steps.vars.outputs.path }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            **/.vs/**
            **/app_offline.htm

      - name: Remove maintenance page
        shell: pwsh
        continue-on-error: true
        run: |
          $ftpUri = "ftp://${{ steps.vars.outputs.server }}${{ steps.vars.outputs.path }}/app_offline.htm"
          $request = [System.Net.FtpWebRequest]::Create($ftpUri)
          $request.Credentials = New-Object System.Net.NetworkCredential("${{ steps.vars.outputs.username }}", "${{ steps.vars.outputs.password }}")
          $request.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $request.UseBinary = $true
          $request.KeepAlive = $false
          
          try {
            $response = $request.GetResponse()
            Write-Host "Maintenance page removed successfully"
            $response.Close()
          } catch {
            Write-Host "Note: Maintenance page may already be removed or not found"
          }

      - name: Wait for app to restart
        shell: pwsh
        run: Start-Sleep -Seconds 5

      - name: Verify deployment
        shell: pwsh
        run: |
          $url = "${{ steps.vars.outputs.url }}"
          $maxRetries = 5
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 10 -UseBasicParsing
              $statusCode = $response.StatusCode
              
              if ($statusCode -eq 200 -or $statusCode -eq 301 -or $statusCode -eq 302) {
                Write-Host "✓ Deployment verified! Site is live with status code: $statusCode"
                $success = $true
              } else {
                Write-Host "Warning: Unexpected status code: $statusCode"
              }
            } catch {
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                Write-Host "Retry $retryCount/$maxRetries - Waiting for site to respond..."
                Start-Sleep -Seconds 5
              } else {
                Write-Host "Error: Site verification failed after $maxRetries attempts"
                Write-Host "Error details: $($_.Exception.Message)"
                exit 1
              }
            }
          }

      - name: Deployment summary
        if: success()
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "Deployment Successful!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "Client: ${{ steps.vars.outputs.client_name }}"
          Write-Host "URL: ${{ steps.vars.outputs.url }}"
          Write-Host "Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "========================================" -ForegroundColor Green