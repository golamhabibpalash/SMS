name: Deploy ASP.NET Core via FTP

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: "Select client to deploy"
        required: true
        type: choice
        options:
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then
            client="Noble"
          fi

          case "$client" in
            "Noble")
              echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
              echo "client_name=Noble" >> $GITHUB_OUTPUT
              ;;
            "Mamitonnesa")
              echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
              echo "client_name=Mamitonnesa" >> $GITHUB_OUTPUT
              ;;
            "DMCPS")
              echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
              echo "client_name=DMCPS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Remove excluded files
        shell: bash
        run: |
          echo "Removing excluded files and folders..."

          # Remove appsettings.json and all variants
          rm -f ./publish/appsettings*.json
          echo "✓ Removed appsettings*.json files"

          # Clean wwwroot folder - remove all css, js, and Reports folders
          if [ -d "./publish/wwwroot" ]; then
            # Remove all files in wwwroot
            find ./publish/wwwroot -type f -delete
            # Remove all subdirectories including css, js, Reports
            rm -rf ./publish/wwwroot/css
            rm -rf ./publish/wwwroot/js
            rm -rf ./publish/wwwroot/Reports
            echo "✓ Cleaned wwwroot folder, removed css, js, Reports"
          fi

          # Remove debug symbols
          rm -f ./publish/*.pdb
          echo "✓ Removed .pdb files"

          echo "Exclusion complete"

      - name: Create maintenance page (outside publish folder)
        shell: bash
        run: |
          cat > ./app_offline.htm << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>System Maintenance</title>
            <style>
              body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-align: center; 
                padding: 50px 20px; 
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
              }
              .container {
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.1);
                max-width: 500px;
              }
              h1 { margin: 0 0 20px 0; font-size: 2em; }
              p { font-size: 1.1em; margin: 10px 0; }
              .spinner {
                border: 4px solid rgba(255,255,255,0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 20px auto;
              }
              @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🔧 System Maintenance</h1>
              <div class="spinner"></div>
              <p>We're updating the system with the latest improvements.</p>
              <p><small>This will only take a moment. Please refresh in a few seconds.</small></p>
            </div>
          </body>
          </html>
          EOF

      - name: Upload maintenance page
        shell: bash
        run: |
          echo "Uploading maintenance page..."
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 30
            set net:max-retries 3
            cd "${{ steps.vars.outputs.path }}"
            put ./app_offline.htm -o app_offline.htm
            quit
          EOF
          echo "✓ Maintenance page uploaded"

      - name: Wait for application to go offline
        run: sleep 5

      - name: Deploy files via FTP
        shell: bash
        run: |
          echo "Starting file deployment..."
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 120
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set net:reconnect-interval-multiplier 1
            set ftp:use-site-chmod no
            set ftp:use-site-utime no
            set file:charset utf-8
            
            cd "${{ steps.vars.outputs.path }}"
            
            # Upload all files from publish folder, overwriting existing ones
            mirror -R \
              --verbose \
              --no-perms \
              --no-umask \
              --exclude-glob app_offline.htm \
              --exclude-glob appsettings*.json \
              --exclude-glob wwwroot/ \
              --exclude-glob Keys/ \
              --exclude-glob logs/ \
              --exclude-glob *.pdb \
              --parallel=3 \
              ./publish/ .
            
            quit
          EOF
          echo "✓ All files deployed successfully"

      - name: Remove maintenance page
        shell: bash
        continue-on-error: true
        run: |
          echo "Removing maintenance page..."
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 30
            cd "${{ steps.vars.outputs.path }}"
            rm -f app_offline.htm
            quit
          EOF
          echo "✓ Maintenance page removed"

      - name: Wait for application startup
        run: sleep 10

      - name: Verify deployment
        shell: bash
        continue-on-error: true
        run: |
          url="${{ steps.vars.outputs.url }}"
          echo "Verifying deployment at: $url"

          for i in {1..5}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" --max-time 10)
            echo "Attempt $i: HTTP $code"
            
            if [[ "$code" == "200" || "$code" == "301" || "$code" == "302" ]]; then
              echo "✓ Deployment verified successfully"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "⚠ Warning: Could not verify deployment. Please check manually."
          exit 0

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "    DEPLOYMENT SUMMARY"
          echo "════════════════════════════════════════"
          echo "Client:     ${{ steps.vars.outputs.client_name }}"
          echo "URL:        ${{ steps.vars.outputs.url }}"
          echo "Time:       $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Status:     ${{ job.status }}"
          echo "════════════════════════════════════════"
          echo ""
          echo "✓ Files deployed automatically via FTP"
          echo "✓ Application should be live at: ${{ steps.vars.outputs.url }}"
          echo ""

      - name: Cleanup local files
        if: always()
        shell: bash
        run: |
          rm -f ./app_offline.htm
          rm -rf ./publish
          echo "✓ Local files cleaned up"
