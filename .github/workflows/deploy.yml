name: Deploy ASP.NET Core to Client

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: "Select client to deploy"
        required: true
        type: choice
        options:
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Show runner info (for debugging paths)
      - name: Show current working directory
        run: |
          echo "PWD: $(pwd)"
          ls -R

      # 3️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 4️⃣ Restore dependencies
      - name: Restore
        run: dotnet restore ./SMS.sln

      # 5️⃣ Build solution
      - name: Build solution
        run: dotnet build ./SMS.sln --configuration Release --no-restore

      # 6️⃣ Publish individual projects
      - name: Publish projects
        run: |
          mkdir -p ./publish
          dotnet publish ./SMS.Frameworks/SMS.Frameworks.csproj -c Release -o ./publish/SMS.Frameworks
          dotnet publish ./SMS.Entities/SMS.Entities.csproj   -c Release -o ./publish/SMS.Entities
          dotnet publish ./SMS.DB/SMS.DB.csproj               -c Release -o ./publish/SMS.DB
          dotnet publish ./SMS.DAL/SMS.DAL.csproj            -c Release -o ./publish/SMS.DAL
          dotnet publish ./SMS.BLL/SMS.BLL.csproj            -c Release -o ./publish/SMS.BLL
          dotnet publish ./SMS_App/SMS_App.csproj            -c Release -o ./publish/SMS_App

      # 7️⃣ Set deployment variables
      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then client="DMCPS"; fi
          echo "Selected client: $client"

          if [ "$client" = "Noble" ]; then
            echo "ftp_server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "ftp_username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "ftp_password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "ftp_path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "deploy_url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
          elif [ "$client" = "Mamitonnesa" ]; then
            echo "ftp_server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "ftp_username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "ftp_password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "ftp_path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "deploy_url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
          elif [ "$client" = "DMCPS" ]; then
            echo "ftp_server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
            echo "ftp_username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "ftp_password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "ftp_path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
            echo "deploy_url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
          else
            echo "Unknown client selected: $client"
            exit 1
          fi

      # 8️⃣ Deploy via FTP
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.vars.outputs.ftp_server }}
          username: ${{ steps.vars.outputs.ftp_username }}
          password: ${{ steps.vars.outputs.ftp_password }}
          server-dir: ${{ steps.vars.outputs.ftp_path }}
          local-dir: ./publish/
          security: loose
          protocol: ftp
          timeout: 900000

      # 9️⃣ Post-deployment HTTP check
      - name: Verify website is live
        shell: pwsh
        run: |
          $url = "${{ steps.vars.outputs.deploy_url }}"
          Write-Host "Checking if website is live at $url ..."
          try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              if ($response.StatusCode -eq 200) {
                  Write-Host "✅ Website $url is live. Deployment successful."
              } else {
                  Write-Error "❌ Website $url returned status $($response.StatusCode)"
              }
          } catch {
              Write-Error "❌ Website $url is not reachable. Deployment failed."
          }
