name: Deploy ASP.NET Core via Smart FTP Sync

on:
  push:
    branches:
      - FinalDeployment
  workflow_dispatch:
    inputs:
      client:
        description: 'Select client to deploy'
        required: true
        type: choice
        options:
          - Noble
          - Mamitonnesa
          - DMCPS

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish --no-build

      - name: Set deployment variables
        id: vars
        shell: bash
        run: |
          client="${{ github.event.inputs.client }}"
          if [ -z "$client" ]; then
            client="DMCPS"
          fi

          case "$client" in
            "Noble")
              echo "server=${{ secrets.NOBLE_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.NOBLE_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.NOBLE_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.NOBLE_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.nobleschoolbd.com" >> $GITHUB_OUTPUT
              echo "client_name=Noble" >> $GITHUB_OUTPUT
              ;;
            "Mamitonnesa")
              echo "server=${{ secrets.MAMI_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.MAMI_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.MAMI_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.MAMI_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mamitonnessaghs.edu.bd" >> $GITHUB_OUTPUT
              echo "client_name=Mamitonnesa" >> $GITHUB_OUTPUT
              ;;
            "DMCPS")
              echo "server=${{ secrets.DMCPS_FTP_SERVER }}" >> $GITHUB_OUTPUT
              echo "username=${{ secrets.DMCPS_FTP_USERNAME }}" >> $GITHUB_OUTPUT
              echo "password=${{ secrets.DMCPS_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
              echo "path=${{ secrets.DMCPS_FTP_PATH }}" >> $GITHUB_OUTPUT
              echo "url=https://eims.mcpsbd.com" >> $GITHUB_OUTPUT
              echo "client_name=DMCPS" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install lftp (if not installed)
        shell: bash
        run: |
          if ! command -v lftp &> /dev/null; then
            echo "Installing lftp..."
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update && sudo apt-get install -y lftp
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install lftp
            else
              echo "Unsupported OS for lftp installation"
            fi
          fi
          lftp --version

      - name: Create maintenance page
        shell: bash
        run: |
          cat > ./maintenance.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Maintenance</title>
            <style>
              body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
              h1 { color: #333; }
              p { color: #666; }
            </style>
          </head>
          <body>
            <h1>System Maintenance</h1>
            <p>We're updating the system. This will only take a moment...</p>
            <p><small>Please refresh in a few seconds</small></p>
          </body>
          </html>
          EOF

      - name: Upload maintenance page
        shell: bash
        run: |
          echo "Uploading maintenance page..."
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 30
            set net:max-retries 3
            cd "${{ steps.vars.outputs.path }}"
            put ./maintenance.html -o app_offline.htm
            quit
          EOF
          echo "Maintenance page uploaded"

      - name: Wait for app to go offline
        run: |
          echo "Waiting for application to go offline..."
          sleep 5
          
      - name: Prepare publish directory (exclude sensitive/config files)
        shell: bash
        run: |
          echo "Preparing publish directory..."
          
          # Create a backup of original files we need to exclude
          if [ -f "./publish/appsettings.json" ]; then
            cp ./publish/appsettings.json ./appsettings_backup.json
          fi
          
          # Create a clean directory for sync
          rm -rf ./publish_sync
          cp -r ./publish ./publish_sync
          
          # Remove files we don't want to overwrite on server
          cd ./publish_sync
          
          # Remove appsettings files
          rm -f appsettings.json
          rm -f appsettings.*.json
          
          # Remove the entire wwwroot folder (don't sync it at all)
          if [ -d "./wwwroot" ]; then
            rm -rf ./wwwroot
            echo "Removed wwwroot folder from sync"
          fi
          
          cd ..
          echo "Publish directory prepared"

      - name: Smart FTP Sync (Upload only changed files)
        shell: bash
        run: |
          echo "Starting smart FTP sync..."
          echo "Connecting to: ${{ steps.vars.outputs.server }}"
          echo "Path: ${{ steps.vars.outputs.path }}"
          
          lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
            set ftp:passive-mode on
            set ssl:verify-certificate no
            set net:timeout 60
            set net:max-retries 5
            set net:reconnect-interval-base 5
            set ftp:use-feat no
            set mirror:use-pget-n 5
            
            cd "${{ steps.vars.outputs.path }}"
            
            echo "Starting mirror operation..."
            
            # Mirror local to remote with smart sync
            mirror \
              --reverse \
              --verbose \
              --delete \
              --only-newer \
              --parallel=5 \
              --exclude "appsettings.json" \
              --exclude "appsettings.*.json" \
              --exclude-glob "wwwroot/Images/*" \
              --no-perms \
              ./publish_sync .
            
            echo "Mirror operation completed"
            quit
          EOF
          
          echo "Smart FTP sync completed"

      - name: Restore app_offline.htm removal with retry
        shell: bash
        continue-on-error: true
        run: |
          echo "Removing maintenance page..."
          max_retries=3
          retry_count=0
          
          while [ $retry_count -lt $max_retries ]; do
            lftp -u "${{ steps.vars.outputs.username }},${{ steps.vars.outputs.password }}" "ftp://${{ steps.vars.outputs.server }}" <<EOF
              set ftp:passive-mode on
              set ssl:verify-certificate no
              set net:timeout 30
              cd "${{ steps.vars.outputs.path }}"
              rm -f app_offline.htm
              quit
            EOF
            
            if [ $? -eq 0 ]; then
              echo "Maintenance page removed successfully"
              break
            else
              retry_count=$((retry_count + 1))
              echo "Failed to remove maintenance page, retry $retry_count/$max_retries"
              sleep 5
            fi
          done
          
          if [ $retry_count -eq $max_retries ]; then
            echo "Warning: Could not remove maintenance page after $max_retries attempts"
          fi

      - name: Verify deployment with retry logic
        shell: bash
        run: |
          url="${{ steps.vars.outputs.url }}"
          max_attempts=12
          attempt=1
          success=false
          
          echo "Verifying deployment for: $url"
          echo "Waiting for application to come online..."
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
            
            # Try to get HTTP status with timeout
            status_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            
            echo "Status code: $status_code"
            
            if [[ "$status_code" == "200" || "$status_code" == "301" || "$status_code" == "302" ]]; then
              echo "✅ Application is online!"
              success=true
              break
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 10 seconds before next attempt..."
              sleep 10
            fi
            
            attempt=$((attempt + 1))
          done
          
          if [ "$success" = false ]; then
            echo "❌ ERROR: Application did not come online after $max_attempts attempts"
            echo "Last status code: $status_code"
            
            # Try to get more detailed error
            curl_error=$(curl -s -o /dev/null -w "%{errormsg}" --max-time 30 "$url" 2>/dev/null || echo "Unknown error")
            echo "Error details: $curl_error"
            
            exit 1
          fi

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          echo "Cleaning up temporary files..."
          rm -rf ./publish_sync
          rm -f ./maintenance.html
          rm -f ./appsettings_backup.json 2>/dev/null || true
          echo "Cleanup completed"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "Client: ${{ steps.vars.outputs.client_name }}"
          echo "URL: ${{ steps.vars.outputs.url }}"
          echo "Server: ${{ steps.vars.outputs.server }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Duration: $((SECONDS / 60)) minutes and $((SECONDS % 60)) seconds"
          echo "========================================"
          
          # Show disk usage info if available
          if [ -d "./publish" ]; then
            echo "Deployment size: $(du -sh ./publish | cut -f1)"
          fi

      - name: Deployment failed notification
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "❌ DEPLOYMENT FAILED"
          echo "========================================"
          echo "Client: ${{ steps.vars.outputs.client_name }}"
          echo "URL: ${{ steps.vars.outputs.url }}"
          echo "Server: ${{ steps.vars.outputs.server }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Error occurred in step: ${{ job.status }}"
          echo "========================================"
          echo "Check the logs above for detailed error information."